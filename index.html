<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICT Service Request System</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ─── HEADER ──────────────────────────────────────── -->
    <header>
        <div class="header-inner">
            <h1>🛠️ ICT Service Request System</h1>
            <div class="user-info">
                <span id="userEmail"></span>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </div>
    </header>

    <!-- ─── DASHBOARD ────────────────────────────────────── -->
    <section class="dashboard">
        <div class="stat-card">
            <h3>Total</h3>
            <span id="totalCount">0</span>
        </div>
        <div class="stat-card pending">
            <h3>Pending</h3>
            <span id="pendingCount">0</span>
        </div>
        <div class="stat-card in-progress">
            <h3>In Progress</h3>
            <span id="inProgressCount">0</span>
        </div>
        <div class="stat-card completed">
            <h3>Completed</h3>
            <span id="completedCount">0</span>
        </div>
    </section>

    <!-- ─── CONTROLS ────────────────────────────────────── -->
    <div class="controls">
        <button id="newRequestBtn" class="btn-primary">＋ New Request</button>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 Search requester or description..." />

            <select id="statusFilter">
                <option value="All">All Status</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>

            <select id="priorityFilter">
                <option value="All">All Priority</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </div>
    </div>

    <!-- ─── REQUEST TABLE ────────────────────────────────── -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Requester</th>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="requestTableBody">
                <!-- rows inserted by JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- ─── CREATE / EDIT FORM ──────────────────────────── -->
    <div id="requestFormContainer" style="display:none;">
        <div class="form-overlay">
            <div class="form-card">
                <h2 id="formTitle">New Service Request</h2>
                <form id="requestForm">
                    <input type="hidden" id="requestId" />

                    <div class="form-group">
                        <label>Requester Name *</label>
                        <input type="text" id="requester_name" required />
                    </div>

                    <div class="form-group">
                        <label>Department *</label>
                        <input type="text" id="department" required />
                    </div>

                    <div class="form-group">
                        <label>Category *</label>
                        <select id="category" required>
                            <option value="">-- Select --</option>
                            <option value="Computer Repair">Computer Repair</option>
                            <option value="Software Installation">Software Installation</option>
                            <option value="Network Problem">Network Problem</option>
                            <option value="Printer Problem">Printer Problem</option>
                            <option value="Account Access">Account Access</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Description *</label>
                        <textarea id="description" rows="3" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Priority *</label>
                            <select id="priority" required>
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select id="status">
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Save</button>
                        <button type="button" class="btn-secondary" onclick="cancelForm()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ─── SCRIPTS ──────────────────────────────────────── -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

    <!-- Attach form submit handler -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('requestForm').addEventListener('submit', saveRequest);

            // Show user email
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                document.getElementById('userEmail').textContent = user.email;
            }
        });
    </script>
</body>
</html>
